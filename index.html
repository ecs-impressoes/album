<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Álbum de Luxo | PhotoBook Premium</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0c0b0e;
      background-image: radial-gradient(circle at 10% 20%, rgba(75, 45, 45, 0.15) 0%, transparent 35%),
                        radial-gradient(circle at 90% 80%, rgba(120, 80, 50, 0.12) 0%, transparent 40%),
                        repeating-linear-gradient(45deg, rgba(255, 215, 150, 0.02) 0px, rgba(255, 215, 150, 0.02) 2px, transparent 2px, transparent 8px);
      min-height: 100vh;
      font-family: 'Montserrat', sans-serif;
      padding: 2rem 1.5rem 4rem;
      color: #e9e1d4;
    }

    /* Efeito de textura de mármore/veludo */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 30% 40%, rgba(180, 130, 70, 0.03) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 1440px;
      margin: 0 auto;
    }

    /* Cabeçalho de luxo */
    .header {
      text-align: center;
      margin-bottom: 3rem;
      position: relative;
    }

    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 4rem;
      font-weight: 700;
      letter-spacing: 6px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #c9a96e, #f3e3c9, #b48b4b, #e7cfab);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 20px rgba(201, 169, 110, 0.3);
      margin-bottom: 0.5rem;
    }

    .header .sub {
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      font-size: 1rem;
      letter-spacing: 8px;
      color: #b9a68b;
      text-transform: uppercase;
      border-top: 1px solid rgba(201, 169, 110, 0.3);
      border-bottom: 1px solid rgba(201, 169, 110, 0.3);
      display: inline-block;
      padding: 0.75rem 2rem;
      backdrop-filter: blur(2px);
    }

    /* Área de upload elegante */
    .upload-area {
      background: rgba(20, 18, 18, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(201, 169, 110, 0.4);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      margin-bottom: 2.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 245, 220, 0.08);
      transition: all 0.4s;
    }

    .upload-area:hover {
      border-color: rgba(201, 169, 110, 0.8);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(201, 169, 110, 0.1);
    }

    .upload-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      gap: 1rem;
    }

    .upload-label svg {
      width: 60px;
      height: 60px;
      stroke: #c9a96e;
      stroke-width: 1.2;
      filter: drop-shadow(0 0 8px rgba(201, 169, 110, 0.5));
    }

    .upload-label span {
      font-size: 1.2rem;
      letter-spacing: 2px;
      color: #d8c8b0;
      font-weight: 300;
    }

    .upload-label small {
      color: #9e8b74;
      font-size: 0.8rem;
      letter-spacing: 1px;
    }

    input[type="file"] {
      display: none;
    }

    /* Botão de gerar álbum */
    .btn-album {
      background: linear-gradient(145deg, #1f1b16, #2a241c);
      border: 1px solid #c9a96e;
      color: #f0e2d0;
      font-family: 'Montserrat', sans-serif;
      font-weight: 400;
      font-size: 1rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      padding: 1rem 3rem;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.4s;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.7), 0 0 15px rgba(201, 169, 110, 0.2);
      margin-bottom: 2.5rem;
      display: inline-block;
      position: relative;
      overflow: hidden;
    }

    .btn-album::after {
      content: "";
      position: absolute;
      top: -50%;
      left: -60%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255, 235, 200, 0.15) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.6s;
    }

    .btn-album:hover {
      background: linear-gradient(145deg, #2a241c, #3a3226);
      border-color: #e7cfab;
      box-shadow: 0 0 30px rgba(201, 169, 110, 0.4), 0 10px 25px rgba(0, 0, 0, 0.9);
      letter-spacing: 5px;
    }

    .btn-album:hover::after {
      opacity: 1;
    }

    /* Contador de fotos */
    .photo-counter {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      color: #c9a96e;
      text-align: right;
      margin-top: 1rem;
      font-style: italic;
      letter-spacing: 1px;
      border-bottom: 1px dashed rgba(201, 169, 110, 0.3);
      padding-bottom: 0.75rem;
    }

    /* GRADE DO ÁLBUM — estilo galeria de luxo */
    .album-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.8rem;
      margin-top: 2rem;
      perspective: 1200px;
    }

    /* Cartão de foto individual */
    .photo-card {
      background: #12100e;
      border: 1px solid rgba(201, 169, 110, 0.3);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(201, 169, 110, 0.1) inset;
      transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1), box-shadow 0.4s, border-color 0.4s;
      position: relative;
      aspect-ratio: 1 / 1; /* base quadrada, mas o conteúdo interno se adapta */
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #181512, #0e0c0a);
    }

    .photo-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: #c9a96e;
      box-shadow: 0 30px 40px -12px black, 0 0 30px rgba(201, 169, 110, 0.2);
      z-index: 5;
    }

    /* A imagem ocupa toda a área, mas mantém a proporção */
    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;  /* mantém a foto inteira, sem cortes */
      display: block;
      background: #0a0907;
      transition: transform 0.5s, filter 0.5s;
      filter: brightness(0.95) contrast(1.05) saturate(1.1);
    }

    .photo-card:hover img {
      transform: scale(1.03);
      filter: brightness(1.05) contrast(1.1) saturate(1.15);
    }

    /* Moldura dourada sutil */
    .photo-card::before {
      content: "";
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      bottom: 8px;
      border: 1px solid rgba(201, 169, 110, 0.15);
      border-radius: 10px;
      pointer-events: none;
      transition: border-color 0.4s;
      z-index: 3;
    }

    .photo-card:hover::before {
      border-color: rgba(201, 169, 110, 0.5);
    }

    /* Efeito de orientação: quando for vertical (retrato), a proporção se ajusta */
    /* Não precisamos forçar tamanho, o object-fit: contain já respeita a orientação original */

    /* Para destacar fotos verticais ou horizontais, podemos adicionar um leve indicador */
    .photo-card[data-orientation="portrait"] {
      /* Nada extra, apenas para referência */
    }

    .photo-card[data-orientation="landscape"] {
      /* Nada extra */
    }

    /* Estado vazio */
    .empty-message {
      text-align: center;
      padding: 4rem 2rem;
      color: #5f5343;
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-style: italic;
      border: 1px dashed rgba(201, 169, 110, 0.3);
      border-radius: 24px;
      background: rgba(0, 0, 0, 0.3);
      grid-column: 1 / -1;
    }

    /* Rodapé */
    .footer {
      margin-top: 4rem;
      text-align: center;
      font-size: 0.7rem;
      letter-spacing: 3px;
      color: #4a4036;
      text-transform: uppercase;
    }

    /* Barra de progresso / feedback */
    .status-msg {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.85rem;
      color: #b9a68b;
      letter-spacing: 2px;
      transition: opacity 0.3s;
    }

    /* Responsividade */
    @media (max-width: 700px) {
      .header h1 {
        font-size: 2.2rem;
        letter-spacing: 3px;
      }
      .header .sub {
        font-size: 0.7rem;
        letter-spacing: 4px;
      }
      .upload-area {
        padding: 1.5rem;
      }
      .btn-album {
        padding: 0.8rem 1.5rem;
        font-size: 0.8rem;
        letter-spacing: 2px;
      }
      .album-grid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 1rem;
      }
      .photo-card::before {
        top: 4px;
        left: 4px;
        right: 4px;
        bottom: 4px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>LUXE ALBUM</h1>
      <div class="sub">Fotografia de eventos · Edição de prestígio</div>
    </div>

    <!-- Área de upload -->
    <div class="upload-area">
      <label for="fileInput" class="upload-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="17 8 12 3 7 8" />
          <line x1="12" y1="3" x2="12" y2="15" />
        </svg>
        <span>Importar fotografias</span>
        <small>Suporta mais de 100 imagens · JPG, PNG, WEBP</small>
      </label>
      <input type="file" id="fileInput" accept="image/*" multiple>
      <div class="status-msg" id="statusMsg"></div>
    </div>

    <!-- Botão principal -->
    <div style="text-align: center;">
      <button class="btn-album" id="generateBtn">Gerar álbum de luxo</button>
    </div>

    <!-- Contador -->
    <div class="photo-counter" id="photoCounter">0 fotografias importadas</div>

    <!-- Álbum de fotos -->
    <div class="album-grid" id="albumGrid">
      <!-- Estado inicial vazio -->
      <div class="empty-message" id="emptyMessage">
        Suas fotografias aparecerão aqui em um álbum de prestígio
      </div>
    </div>

    <div class="footer">
      © LUXE ALBUM · Coleção privada
    </div>
  </div>

  <script>
    (function() {
      // Elementos DOM
      const fileInput = document.getElementById('fileInput');
      const generateBtn = document.getElementById('generateBtn');
      const albumGrid = document.getElementById('albumGrid');
      const photoCounter = document.getElementById('photoCounter');
      const statusMsg = document.getElementById('statusMsg');
      const emptyMessage = document.getElementById('emptyMessage');

      // Estado: armazena os arquivos de imagem (File objects) e as URLs dos objetos
      let selectedFiles = [];        // Array de File
      let imageUrls = [];           // Array de strings (URLs de objeto)

      // Função para limpar todas as URLs de objeto criadas (evitar vazamentos)
      function revokeAllUrls() {
        imageUrls.forEach(url => URL.revokeObjectURL(url));
        imageUrls = [];
      }

      // Atualiza o contador e o estado do botão
      function updateCounter() {
        const count = selectedFiles.length;
        photoCounter.textContent = count === 0 
          ? '0 fotografias importadas' 
          : `${count} fotografia${count > 1 ? 's' : ''} importada${count > 1 ? 's' : ''}`;
        
        if (count === 0) {
          statusMsg.textContent = '';
        } else {
          statusMsg.textContent = `Pronto para gerar álbum com ${count} imagem${count > 1 ? 's' : ''}`;
        }
      }

      // Limpa completamente o álbum e as seleções (sem apagar os arquivos ainda, apenas exibição)
      function clearAlbumDisplay() {
        // Remove todos os cards, mantém apenas a mensagem vazia?
        // Vamos remover tudo e recriar a mensagem vazia se necessário
        const cards = albumGrid.querySelectorAll('.photo-card');
        cards.forEach(card => card.remove());
        
        // Se não houver cards, mostra a mensagem vazia
        if (albumGrid.querySelectorAll('.photo-card').length === 0) {
          if (!document.getElementById('emptyMessage')) {
            const emptyDiv = document.createElement('div');
            emptyDiv.className = 'empty-message';
            emptyDiv.id = 'emptyMessage';
            emptyDiv.textContent = 'Suas fotografias aparecerão aqui em um álbum de prestígio';
            albumGrid.appendChild(emptyDiv);
          } else {
            document.getElementById('emptyMessage').style.display = 'block';
          }
        } else {
          const empty = document.getElementById('emptyMessage');
          if (empty) empty.style.display = 'none';
        }
      }

      // Remove a mensagem de vazio se existir
      function hideEmptyMessage() {
        const empty = document.getElementById('emptyMessage');
        if (empty) empty.style.display = 'none';
      }

      // Verifica a orientação da imagem e retorna 'portrait' ou 'landscape' ou 'square'
      // Esta função é usada apenas para definir o atributo data-orientation (informativo)
      function getImageOrientation(img) {
        const w = img.naturalWidth;
        const h = img.naturalHeight;
        if (w > h) return 'landscape';
        if (h > w) return 'portrait';
        return 'square';
      }

      // Cria um card de foto com base no File e URL
      function createPhotoCard(file, url) {
        const card = document.createElement('div');
        card.className = 'photo-card';
        
        const img = document.createElement('img');
        img.src = url;
        img.alt = file.name;
        img.loading = 'lazy'; // carregamento preguiçoso para muitas imagens
        
        // Quando a imagem carregar, definimos a orientação no card
        img.onload = function() {
          const orientation = getImageOrientation(img);
          card.setAttribute('data-orientation', orientation);
          // Não é necessário ajustar CSS, o object-fit: contain já mantém a proporção e orientação
          // A foto vertical aparece vertical, horizontal aparece horizontal
        };
        
        // Caso a imagem falhe ao carregar
        img.onerror = function() {
          card.style.background = '#2a1f1a';
          card.innerHTML = '<div style="color:#b9a68b; font-size:0.8rem; text-align:center; padding:1rem;">Imagem indisponível</div>';
        };

        card.appendChild(img);
        return card;
      }

      // Processa os arquivos selecionados e monta o álbum
      function buildAlbum() {
        // Se não houver arquivos, avisa
        if (selectedFiles.length === 0) {
          statusMsg.textContent = 'Nenhuma fotografia importada. Selecione imagens primeiro.';
          return;
        }

        // Limpa as URLs antigas (revoga)
        revokeAllUrls();
        
        // Limpa o grid
        albumGrid.innerHTML = ''; // remove tudo, inclusive a mensagem vazia
        
        // Cria fragmento para performance
        const fragment = document.createDocumentFragment();

        // Para cada arquivo, cria URL e card
        selectedFiles.forEach(file => {
          const url = URL.createObjectURL(file);
          imageUrls.push(url);
          
          const card = createPhotoCard(file, url);
          fragment.appendChild(card);
        });

        // Adiciona todos os cards de uma vez
        albumGrid.appendChild(fragment);
        
        // Atualiza estado visual (remove mensagem vazia se por acaso ficou)
        hideEmptyMessage(); // não deve ter, mas garantimos
        
        // Rola suavemente até o álbum
        albumGrid.scrollIntoView({ behavior: 'smooth', block: 'start' });
        
        // Atualiza mensagem
        statusMsg.textContent = `Álbum gerado com ${selectedFiles.length} fotografia${selectedFiles.length > 1 ? 's' : ''}.`;
      }

      // Manipula a seleção de arquivos
      function handleFileSelect(event) {
        const files = event.target.files;
        if (!files || files.length === 0) {
          return;
        }

        // Converte FileList para array e filtra apenas imagens
        const imageFiles = Array.from(files).filter(file => file.type.startsWith('image/'));
        
        if (imageFiles.length === 0) {
          statusMsg.textContent = 'Nenhum arquivo de imagem válido selecionado.';
          return;
        }

        // Limita a quantidade? Não, suporta mais de 100. Mas avisamos se for muito grande?
        // Suporta quantas o navegador aguentar (URLs de objeto são leves até certo ponto)
        // Vamos apenas manter todos.

        // Atualiza o array de arquivos (substitui ou adiciona? Ação: substituir os antigos por novos)
        // Para um comportamento mais intuitivo: substitui os arquivos anteriores pelos novos selecionados.
        // Mas o usuário pode querer adicionar mais? A interface é simples, então vamos SUBSTITUIR.
        // Se quiser adicionar, pode ser uma melhoria futura.
        selectedFiles = imageFiles;

        // Limpa álbum anterior e URLs antigas
        revokeAllUrls();
        albumGrid.innerHTML = ''; // limpa
        
        // Recria a mensagem vazia se não houver fotos? Mas temos fotos, então não mostramos vazio
        // Adicionamos um feedback
        updateCounter();
        statusMsg.textContent = `${selectedFiles.length} imagem${selectedFiles.length > 1 ? 'ns' : ''} importada${selectedFiles.length > 1 ? 's' : ''}. Clique em "Gerar álbum de luxo".`;
        
        // Opcional: mostrar uma prévia? Não, só gerar álbum quando clicar.
        // Mas para UX, podemos já mostrar as fotos? A ideia é que o botão gere.
        // No entanto, o usuário pode querer ver o que importou. Vamos exibir uma prévia? 
        // Para manter o controle, vamos apenas limpar e mostrar a mensagem vazia? Não, melhor colocar placeholders?
        // Vou exibir uma mensagem no grid? Deixo vazio? Acho que mostrar a mensagem "Clique em gerar álbum" é bom.
        if (selectedFiles.length > 0) {
          albumGrid.innerHTML = `<div class="empty-message" style="display:block; font-size:1.2rem; color:#9e8b74;">✨ ${selectedFiles.length} fotografia${selectedFiles.length > 1 ? 's' : ''} prontas para o álbum ✨<br><span style="font-size:0.9rem; letter-spacing:2px;">Clique em "Gerar álbum de luxo"</span></div>`;
        } else {
          // Se não houver, volta mensagem padrão
          albumGrid.innerHTML = `<div class="empty-message" id="emptyMessage">Suas fotografias aparecerão aqui em um álbum de prestígio</div>`;
        }
      }

      // Event listeners
      fileInput.addEventListener('change', handleFileSelect);
      
      generateBtn.addEventListener('click', function(e) {
        e.preventDefault();
        buildAlbum();
      });

      // Inicializa: garante que a mensagem vazia está correta
      (function init() {
        // Se não houver nada no grid, coloca a mensagem vazia
        if (!albumGrid.hasChildNodes() || albumGrid.children.length === 0) {
          albumGrid.innerHTML = `<div class="empty-message" id="emptyMessage">Suas fotografias aparecerão aqui em um álbum de prestígio</div>`;
        }
        updateCounter();
      })();

      // Limpeza de URLs quando a página for descarregada
      window.addEventListener('beforeunload', function() {
        revokeAllUrls();
      });

    })();
  </script>
</body>
</html>
